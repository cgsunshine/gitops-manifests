apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-hello
  labels:
    app: gitops-hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitops-hello
  template:
    metadata:
      labels:
        app: gitops-hello
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi