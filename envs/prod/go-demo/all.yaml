apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-demo
  labels:
    app: go-demo
    env: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-demo
  template:
    metadata:
      labels:
        app: go-demo
        env: prod
    spec:
      containers:
        - name: web
          image: ghcr.io/cgsunshine/go-demo:prod-1dddbc8
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_VERSION
              value: "prod-1dddbc8"
            - name: APP_ENV
              value: "prod"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: go-demo
  labels:
    app: go-demo
spec:
  selector:
    app: go-demo
  ports:
    - port: 80
      targetPort: 8080